    <!-- Otimização das imagens remotas: redimensiona e converte para AVIF/WebP no CDN do Vercel. -->
    <script>
      (function () {
        var SOURCE = 'https://rainbow-brioche-d5ce72.netlify.app/images/';
        var OPTIMIZED = '/_vercel/image?url=';
        var originalSrc = HTMLImageElement.prototype.getAttribute;
        var originalSetAttribute = HTMLImageElement.prototype.setAttribute;
        var originalSrcDescriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');

        function getOptimizedUrl(value, element) {
          if (!value || value.indexOf(SOURCE) !== 0 || value.indexOf('/_vercel/image?') !== -1) return value;
          var width = element && (element.clientWidth || element.getBoundingClientRect().width);
          width = Math.ceil((width || Math.min(window.innerWidth, 768)) * Math.min(window.devicePixelRatio || 1, 2));
          var sizes = [320, 480, 640, 768, 1024, 1280, 1536];
          var target = sizes[sizes.length - 1];
          for (var i = 0; i < sizes.length; i++) {
            if (sizes[i] >= width) { target = sizes[i]; break; }
          }
          return OPTIMIZED + encodeURIComponent(value) + '&w=' + target + '&q=70';
        }

        Object.defineProperty(HTMLImageElement.prototype, 'src', {
          configurable: true,
          get: originalSrcDescriptor && originalSrcDescriptor.get,
          set: function (value) {
            if (typeof value === 'string') value = getOptimizedUrl(value, this);
            if (originalSrcDescriptor && originalSrcDescriptor.set) originalSrcDescriptor.set.call(this, value);
          }
        });

        HTMLImageElement.prototype.setAttribute = function (name, value) {
          if (name.toLowerCase() === 'src' && typeof value === 'string') value = getOptimizedUrl(value, this);
          return originalSetAttribute.call(this, name, value);
        };

        function optimizeExistingImages() {
          document.querySelectorAll('img[src^="' + SOURCE + '"]').forEach(function (image) {
            var value = originalSrc.call(image, 'src');
            if (value) originalSetAttribute.call(image, 'src', getOptimizedUrl(value, image));
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', optimizeExistingImages, { once: true });
        } else {
          optimizeExistingImages();
        }
      })();
    </script>
