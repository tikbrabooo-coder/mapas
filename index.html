    <!-- Redirecionamento dos checkouts dos planos. O tratamento ocorre no capture para preservar o fluxo do React. -->
    <script>
      (function () {
        var CHECKOUT_MAP = {
          'https://app.zuptos.com.br/checkout/3964ebc0548af57e': 'https://app.zuptos.com.br/checkout/40d7bf7e99b9c963',
          'https://app.zuptos.com.br/checkout/58864c8277caafae': 'https://app.zuptos.com.br/checkout/dc9508e2442481d9'
        };
        document.addEventListener('click', function (event) {
          var target = event.target;
          var anchor = target && target.closest ? target.closest('a') : null;
          if (!anchor) return;
          var href = anchor.getAttribute('href');
          if (!href || !CHECKOUT_MAP[href]) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          var destination = new URL(CHECKOUT_MAP[href]);
          var params = new URLSearchParams(window.location.search);
          params.forEach(function (value, key) { if (value) destination.searchParams.set(key, value); });
          window.location.assign(destination.toString());
        }, true);

        // O botão "NÃO, QUERO LEVAR O PLANO DE R$ 9,90" do popup deve abrir o checkout de R$ 9,90.
        document.addEventListener('click', function (event) {
          var target = event.target;
          var element = target && target.closest ? target.closest('a,button') : null;
          if (!element) return;
          var text = (element.textContent || '').replace(/\s+/g, ' ').trim().toUpperCase();
          if (text !== 'NÃO, QUERO LEVAR O PLANO DE R$ 9,90') return;
          event.preventDefault();
          event.stopImmediatePropagation();
          var destination = new URL('https://app.zuptos.com.br/checkout/597422a2be19f26c');
          var params = new URLSearchParams(window.location.search);
          params.forEach(function (value, key) { if (value) destination.searchParams.set(key, value); });
          window.location.assign(destination.toString());
        }, true);
      })();
    </script>

    <!-- Otimização somente para imagens da biblioteca Netlify. Depoimentos do GitHub e selo de garantia permanecem com URL direta para garantir compatibilidade. -->
    <script>
      (function () {
        var VERCEL_IMAGE = '/_vercel/image?url=';
        var NETLIFY_SOURCE = 'https://rainbow-brioche-d5ce72.netlify.app/images/';
        var originalSetAttribute = HTMLImageElement.prototype.setAttribute;
        var originalSrcDescriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');

        function optimize(value) {
          if (!value || typeof value !== 'string') return value;
          if (value.indexOf('/_vercel/image?') !== -1 || value.indexOf(NETLIFY_SOURCE) !== 0) return value;
          if (value.indexOf('garantia-30d') !== -1) return value;
          var width = 768;
          if (value.indexOf('mapa-') !== -1 || value.indexOf('ChatGPT Image 2 de out. de 2026, 11_') !== -1) width = 768;
          return VERCEL_IMAGE + encodeURIComponent(value) + '&w=' + width + '&q=70';
        }

        Object.defineProperty(HTMLImageElement.prototype, 'src', {
          configurable: true,
          get: originalSrcDescriptor && originalSrcDescriptor.get,
          set: function (value) {
            if (typeof value === 'string') value = optimize(value);
            if (originalSrcDescriptor && originalSrcDescriptor.set) originalSrcDescriptor.set.call(this, value);
          }
        });

        HTMLImageElement.prototype.setAttribute = function (name, value) {
          if (name.toLowerCase() === 'src' && typeof value === 'string') value = optimize(value);
          return originalSetAttribute.call(this, name, value);
        };
      })();
    </script>
