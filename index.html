    <script>
      (function () {
        var CHECKOUT_MAP = {
          'https://app.zuptos.com.br/checkout/3964ebc0548af57e': 'https://app.zuptos.com.br/checkout/40d7bf7e99b9c963',
          'https://app.zuptos.com.br/checkout/58864c8277caafae': 'https://app.zuptos.com.br/checkout/40d7bf7e99b9c963'
        };
        function trackInitiateCheckout(name, value) {
          try {
            if (typeof window.__loadMetaPixel === 'function') window.__loadMetaPixel();
            if (typeof window.fbq === 'function') {
              window.fbq('track', 'InitiateCheckout', {
                content_name: name || 'Plano',
                content_type: 'product',
                currency: 'BRL',
                value: value || undefined
              });
              return true;
            }
          } catch (error) {}
          return false;
        }

        function go(destinationUrl, name, value) {
          var tracked = trackInitiateCheckout(name, value);
          var destination = new URL(destinationUrl);

          // Preserve attribution parameters on the external Zuptos checkout.
          // The checkout is hosted by Zuptos, so its page cannot be modified from this Vercel site.
          // We therefore forward the original UTM/click identifiers explicitly.
          var attributionKeys = [
            'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term',
            'utm_id', 'utm_source_platform', 'utm_campaign_id', 'utm_adset_id',
            'utm_ad_id', 'fbclid', 'gclid', 'gbraid', 'wbraid', 'ttclid', 'msclkid'
          ];
          var currentParams = new URLSearchParams(window.location.search);

          // Keep a session copy so attribution survives intermediate URL changes.
          try {
            attributionKeys.forEach(function (key) {
              var value = currentParams.get(key);
              if (value) sessionStorage.setItem('mapas_attr_' + key, value);
            });
          } catch (error) {}

          attributionKeys.forEach(function (key) {
            var value = currentParams.get(key);
            if (!value) {
              try { value = sessionStorage.getItem('mapas_attr_' + key); } catch (error) {}
            }
            if (value) destination.searchParams.set(key, value);
          });

          // Keep any other query parameters already present on the landing page too.
          currentParams.forEach(function (value, key) {
            if (value && !destination.searchParams.has(key)) destination.searchParams.set(key, value);
          });

          // Give the Meta Pixel a moment to queue/send InitiateCheckout before leaving the page.
          window.setTimeout(function () {
            window.location.assign(destination.toString());
          }, tracked ? 300 : 0);
        }
        document.addEventListener('click', function (event) {
          var target = event.target;
          var element = target && target.closest ? target.closest('a,button') : null;
          if (!element) return;
          var href = element.getAttribute('href');
          if (href && CHECKOUT_MAP[href]) {
            event.preventDefault();
            event.stopImmediatePropagation();
            go(CHECKOUT_MAP[href], 'Plano Completo', 19.90);
            return;
          }
          var text = (element.textContent || '').replace(/\s+/g, ' ').trim().toUpperCase();
          if (text === 'NÃO, QUERO LEVAR O PLANO DE R$ 9,90') {
            event.preventDefault();
            event.stopImmediatePropagation();
            go('https://app.zuptos.com.br/checkout/597422a2be19f26c', 'Plano Essencial', 9.90);
            return;
          }
          if (text === 'QUERO ADQUIRIR PLANO COMPLETO POR 19,90') {
            event.preventDefault();
            event.stopImmediatePropagation();
            go('https://app.zuptos.com.br/checkout/40d7bf7e99b9c963', 'Plano Completo', 19.90);
          }
        }, true);
      })();
    </script>
